name: Stage AIPAC PAC disbursements
on:
  workflow_dispatch:
    inputs:
      election_cycle:
        description: Election cycle
        required: true
        type: choice
        options: ['2026', '2024', '2022']
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Stage candidate-committee disbursements for review
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELECTION_CYCLE: ${{ inputs.election_cycle }}
        run: python scripts/fec_pac_ingest.py
