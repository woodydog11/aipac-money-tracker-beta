name: Import FEC records
on:
  workflow_dispatch:
    inputs:
      election_cycle:
        description: Election cycle
        required: true
        type: choice
        options: ['2026', '2024', '2022']
  schedule:
    - cron: '35 8 * * 2'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Verify required secrets exist
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for key in FEC_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!key}" ]; then echo "::error::Missing repository secret: $key"; exit 1; fi
          done
      - name: Import pending records
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELECTION_CYCLE: ${{ inputs.election_cycle || '2026' }}
        run: python scripts/fec_ingest.py
